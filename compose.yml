services:
  db:
    image: postgres:18.3
    container_name: erp_db
    restart: always
    volumes:
      - erp-db-data:/var/lib/postgresql/
    expose:
      - 5432
    ports:
      - 5432:5432
    env_file:
      - backend/.env
    networks:
      - erp_network
    command: ["postgres", "-c", "log_min_duration_statement=50", "-c", "shared_preload_libraries=pg_stat_statements"]

  redis:
    image: redis:8-alpine
    container_name: erp_redis
    restart: always
    expose:
      - 6379
    ports:
      - 6379:6379
    networks:
      - erp_network
    
volumes:
  erp-db-data:

networks:
  erp_network:
    driver: bridge